<style>
  :root{
    --bg:#F5F5F4; --surface:#FFFFFF; --line:#E2E2DE;
    --text:#111111; --muted:#68686D;
    --accent:#2563EB; --accent-soft:#C7D2FE;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:32px;
  }
  .icon{ width:64px; height:64px; margin:0 auto 24px; }
  .code{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:clamp(4rem, 14vw, 7rem);
    font-weight:700;
    color:var(--accent);
    line-height:1;
  }
  h1{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:1.6rem; font-weight:700; margin-top:18px;
  }
  p{ color:var(--muted); margin-top:12px; max-width:44ch; margin-left:auto; margin-right:auto; }
  a.btn{
    display:inline-block; margin-top:32px;
    background:var(--accent); color:#FFFFFF;
    padding:14px 28px; border-radius:100px;
    font-weight:600; text-decoration:none;
  }
  a.btn:hover{ background:#1D4FD1; }
</style>
</head>
